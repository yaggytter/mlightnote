# The npm packages live in one workspace (root package.json + web/) with a
# single lock file at the root, so Dependabot must look at "/", not "/web".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Do not pick up a release in its first days (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must move together: React refuses to run when
      # their versions differ.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
