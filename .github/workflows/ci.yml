name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  verify:
    name: Unit tests, type check, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: make verify
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: node_modules/.bin/playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-smoke:
    name: Production build behind nginx (CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: make deploy
