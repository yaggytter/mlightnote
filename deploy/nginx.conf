worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A static site: no external connections at runtime (APP_DESIGN.md
    # §4.3, §17.4), and no server-side API — the app, its engine Worker and
    # its storage all run in the browser. CSP is intentionally strict;
    # loosen only per an ADR.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Cloudflare Pages' header rules (web/public/_headers) aren't content.
    location = /_headers {
      return 404;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
